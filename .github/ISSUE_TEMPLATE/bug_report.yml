name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please search the existing issues first, including closed ones.

        **Security vulnerabilities:** don't report them here. Use the repository's Security tab > **Report a vulnerability** instead.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version, release or commit are you using?
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, device, and anything else relevant (browser, runtime version).
      placeholder: e.g. macOS 26.1, iPhone 16 with iOS 26.1, Python 3.12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant log output. This is formatted as code automatically.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, recordings or anything else that helps explain the problem.
